HTML
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자재 입출고 관리 시스템</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTML5 QR Code Scanner CDN -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <!-- PWA Manifest Link -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3b82f6">
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

    <!-- 상단 헤더 -->
    <header class="bg-blue-600 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-lg font-bold">📦 자재 입출고 관리</h1>
            <div class="flex items-center space-x-2">
                <span id="roleBadge" class="text-xs bg-blue-700 px-2.5 py-1 rounded-full">작업자 모드</span>
                <button id="authBtn" onclick="toggleAuthModal()" class="bg-white text-blue-600 text-xs px-3 py-1.5 rounded font-semibold shadow hover:bg-slate-50 transition">
                    관리자 전환
                </button>
            </div>
        </div>
    </header>

    <!-- 메인 컨테이너 -->
    <main class="max-w-4xl mx-auto px-4 py-6 space-y-6">

        <!-- 탭 메뉴 -->
        <div class="flex border-b border-slate-300 bg-white rounded-t-lg shadow-sm overflow-hidden">
            <button onclick="switchTab('scan')" id="tabScanBtn" class="flex-1 py-3 text-center font-bold text-blue-600 border-b-2 border-blue-600 bg-blue-50/50 transition text-xs sm:text-sm">QR 스캔 / 입출고</button>
            <button onclick="switchTab('inventory')" id="tabInvBtn" class="flex-1 py-3 text-center font-bold text-slate-500 hover:text-slate-800 transition text-xs sm:text-sm">자재 현황</button>
            <button onclick="switchTab('admin')" id="tabAdminBtn" class="flex-1 py-3 text-center font-bold text-slate-500 hover:text-slate-800 transition text-xs sm:text-sm hidden">자재 관리(관리자)</button>
        </div>

        <!-- 1. [탭] 스캔 및 입출고 처리 -->
        <section id="tabScan" class="space-y-4">
            <div class="bg-white p-5 rounded-xl shadow-sm space-y-4">
                <h2 class="font-bold text-slate-700">📷 QR / 바코드 스캐너</h2>
                <div id="reader" class="w-full rounded-lg overflow-hidden border border-slate-200"></div>
                <div class="flex gap-2">
                    <input type="text" id="manualCode" placeholder="자재 코드 직접 입력 또는 스캔" class="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button onclick="searchMaterialByCode()" class="bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-slate-700">조회</button>
                </div>
            </div>

            <!-- 입출고 처리 폼 -->
            <div id="actionCard" class="bg-white p-5 rounded-xl shadow-sm space-y-4 hidden">
                <div class="bg-blue-50 p-3 rounded-lg border border-blue-100">
                    <p class="text-xs text-blue-600 font-bold">선택된 자재</p>
                    <p id="selectedItemName" class="text-base font-bold text-slate-800">-</p>
                    <p class="text-xs text-slate-500">현재고: <span id="selectedItemStock" class="font-bold text-blue-600">0</span>개</p>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <button onclick="processTx('IN')" class="bg-emerald-600 text-white py-3 rounded-lg font-bold shadow hover:bg-emerald-700 transition">📥 입고 처리</button>
                    <button onclick="processTx('OUT')" class="bg-rose-600 text-white py-3 rounded-lg font-bold shadow hover:bg-rose-700 transition">📤 출고 처리</button>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">수량</label>
                    <input type="number" id="txQty" value="1" min="1" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">작업자 / 비고</label>
                    <input type="text" id="txMemo" placeholder="예: 홍길동 (라인 투입)" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>
        </section>

        <!-- 2. [탭] 자재 현황 및 로그 -->
        <section id="tabInventory" class="space-y-4 hidden">
            <div class="bg-white p-5 rounded-xl shadow-sm space-y-3">
                <div class="flex justify-between items-center">
                    <h2 class="font-bold text-slate-700">📊 전체 자재 목록</h2>
                    <button onclick="exportCSV()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded font-semibold">CSV 다운로드</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-sm">
                        <thead>
                            <tr class="border-b border-slate-200 text-slate-500 bg-slate-50">
                                <th class="p-2.5">코드</th>
                                <th class="p-2.5">자재명</th>
                                <th class="p-2.5">규격</th>
                                <th class="p-2.5 text-right">재고수량</th>
                            </tr>
                        </thead>
                        <tbody id="inventoryTableBody">
                            <!-- 동적 생성 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- 3. [탭] 관리자 전용 자재 등록/수정 및 비밀번호 변경 -->
        <section id="tabAdmin" class="space-y-6 hidden">
            <div class="bg-white p-5 rounded-xl shadow-sm space-y-4 border-2 border-amber-200">
                <h2 class="font-bold text-amber-800 flex items-center gap-1">🔒 자재 마스터 등록 및 관리</h2>
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">자재 코드</label>
                        <input type="text" id="adminCode" placeholder="예: MTR-001" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">자재명</label>
                        <input type="text" id="adminName" placeholder="예: 볼트 M10" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">규격 / 위치</label>
                        <input type="text" id="adminSpec" placeholder="예: 스텐 재질 / A구역" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">초기 재고수량</label>
                        <input type="number" id="adminStock" value="0" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
                    </div>
                    <button onclick="saveMaterial()" class="w-full bg-amber-600 text-white py-2.5 rounded-lg font-bold shadow hover:bg-amber-700 transition">자재 등록 / 수정 저장</button>
                </div>
            </div>

            <!-- 관리자 비밀번호 변경 박스 -->
            <div class="bg-white p-5 rounded-xl shadow-sm space-y-4 border border-slate-200">
                <h2 class="font-bold text-slate-700">🔑 관리자 비밀번호 변경</h2>
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">기존 비밀번호</label>
                        <input type="password" id="currentPassword" placeholder="현재 비밀번호 입력" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">새 비밀번호</label>
                        <input type="password" id="newPassword" placeholder="새 비밀번호 입력" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
                    </div>
                    <button onclick="changeAdminPassword()" class="w-full bg-slate-800 text-white py-2.5 rounded-lg font-bold shadow hover:bg-slate-700 transition">비밀번호 변경</button>
                </div>
            </div>
        </section>
    </main>

    <!-- 관리자 비밀번호 모달 -->
    <div id="authModal" class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white rounded-xl p-6 max-w-sm w-full space-y-4">
            <h3 class="font-bold text-lg text-slate-800">관리자 인증</h3>
            <p class="text-xs text-slate-500">관리자 모드로 전환하려면 비밀번호를 입력하세요.</p>
            <input type="password" id="adminPasswordInput" placeholder="비밀번호 입력" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
            <div class="flex gap-2">
                <button onclick="toggleAuthModal()" class="flex-1 bg-slate-200 text-slate-700 py-2 rounded-lg text-sm font-semibold">취소</button>
                <button onclick="verifyAdmin()" class="flex-1 bg-blue-600 text-white py-2 rounded-lg text-sm font-semibold">확인</button>
            </div>
        </div>
    </div>

    <script>
        // 초기 자재 데이터
        let materials = JSON.parse(localStorage.getItem('yjhitech_materials')) || [
            { code: 'MTR-001', name: '볼트 M10', spec: '스텐 / A구역', stock: 150 },
            { code: 'MTR-002', name: '너트 M10', spec: '철 / B구역', stock: 320 }
        ];

        // 관리자 비밀번호 초기화 (기본값: dudwjs1998$$)
        let adminPw = localStorage.getItem('yjhitech_admin_pw') || 'dudwjs1998$$';

        let isAdmin = false;
        let currentScannedCode = null;
        let html5QrCode = null;

        // 탭 전환 기능
        function switchTab(tabName) {
            document.getElementById('tabScan').classList.add('hidden');
            document.getElementById('tabInventory').classList.add('hidden');
            document.getElementById('tabAdmin').classList.add('hidden');

            document.getElementById('tabScanBtn').className = "flex-1 py-3 text-center font-bold text-slate-500 hover:text-slate-800 transition text-xs sm:text-sm";
            document.getElementById('tabInvBtn').className = "flex-1 py-3 text-center font-bold text-slate-500 hover:text-slate-800 transition text-xs sm:text-sm";
            document.getElementById('tabAdminBtn').className = "flex-1 py-3 text-center font-bold text-slate-500 hover:text-slate-800 transition text-xs sm:text-sm";

            if(tabName === 'scan') {
                document.getElementById('tabScan').classList.remove('hidden');
                document.getElementById('tabScanBtn').className = "flex-1 py-3 text-center font-bold text-blue-600 border-b-2 border-blue-600 bg-blue-50/50 transition text-xs sm:text-sm";
                startScanner();
            } else {
                stopScanner();
                if(tabName === 'inventory') {
                    document.getElementById('tabInventory').classList.remove('hidden');
                    document.getElementById('tabInvBtn').className = "flex-1 py-3 text-center font-bold text-blue-600 border-b-2 border-blue-600 bg-blue-50/50 transition text-xs sm:text-sm";
                    renderInventory();
                } else if(tabName === 'admin' && isAdmin) {
                    document.getElementById('tabAdmin').classList.remove('hidden');
                    document.getElementById('tabAdminBtn').className = "flex-1 py-3 text-center font-bold text-amber-600 border-b-2 border-amber-600 bg-amber-50/50 transition text-xs sm:text-sm";
                }
            }
        }

        // QR 스캐너 시작
        function startScanner() {
            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 200, height: 200 } },
                (decodedText) => {
                    document.getElementById('manualCode').value = decodedText;
                    searchMaterialByCode();
                },
                (error) => {}
            ).catch(err => {
                console.log("카메라 실행 오류 또는 권한 없음");
            });
        }

        function stopScanner() {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().catch(err => console.log(err));
            }
        }

        // 자재 코드 조회
        function searchMaterialByCode() {
            const code = document.getElementById('manualCode').value.trim();
            const item = materials.find(m => m.code === code);
            const actionCard = document.getElementById('actionCard');

            if(item) {
                currentScannedCode = code;
                document.getElementById('selectedItemName').innerText = `${item.name} (${item.spec})`;
                document.getElementById('selectedItemStock').innerText = item.stock;
                actionCard.classList.remove('hidden');
            } else {
                alert('등록되지 않은 자재 코드입니다.');
                actionCard.classList.add('hidden');
            }
        }

        // 입출고 처리
        function processTx(type) {
            const qty = parseInt(document.getElementById('txQty').value);
            const memo = document.getElementById('txMemo').value;
            const item = materials.find(m => m.code === currentScannedCode);

            if(!item) return;

            if(type === 'OUT') {
                if(item.stock < qty) {
                    alert('재고가 부족합니다!');
                    return;
                }
                item.stock -= qty;
            } else {
                item.stock += qty;
            }

            localStorage.setItem('yjhitech_materials', JSON.stringify(materials));
            alert(`${type === 'IN' ? '입고' : '출고'}가 완료되었습니다! 현재고: ${item.stock}`);
            document.getElementById('selectedItemStock').innerText = item.stock;
            document.getElementById('txQty').value = 1;
            document.getElementById('txMemo').value = '';
        }

        // 인벤토리 렌더링
        function renderInventory() {
            const tbody = document.getElementById('inventoryTableBody');
            tbody.innerHTML = '';
            materials.forEach(m => {
                tbody.innerHTML += `
                    <tr class="border-b border-slate-100 hover:bg-slate-50">
                        <td class="p-2.5 font-mono text-xs">${m.code}</td>
                        <td class="p-2.5 font-medium">${m.name}</td>
                        <td class="p-2.5 text-slate-500 text-xs">${m.spec}</td>
                        <td class="p-2.5 text-right font-bold text-blue-600">${m.stock}</td>
                    </tr>
                `;
            });
        }

        // 관리자 인증 모달 토글
        function toggleAuthModal() {
            const modal = document.getElementById('authModal');
            modal.classList.toggle('hidden');
        }

        // 관리자 비밀번호 확인
        function verifyAdmin() {
            const pw = document.getElementById('adminPasswordInput').value;
            if(pw === adminPw) {
                isAdmin = true;
                document.getElementById('roleBadge').innerText = "관리자 모드";
                document.getElementById('roleBadge').className = "text-xs bg-amber-600 px-2.5 py-1 rounded-full text-white font-bold";
                document.getElementById('authBtn').innerText = "작업자 전환";
                document.getElementById('authBtn').setAttribute('onclick', 'switchToWorker()');
                
                // 관리자 탭 보이기
                document.getElementById('tabAdminBtn').classList.remove('hidden');
                toggleAuthModal();
                alert('관리자 모드로 전환되었습니다.');
                switchTab('admin');
            } else {
                alert('비밀번호가 틀렸습니다.');
            }
            document.getElementById('adminPasswordInput').value = '';
        }

        function switchToWorker() {
            isAdmin = false;
            document.getElementById('roleBadge').innerText = "작업자 모드";
            document.getElementById('roleBadge').className = "text-xs bg-blue-700 px-2.5 py-1 rounded-full";
            document.getElementById('authBtn').innerText = "관리자 전환";
            document.getElementById('authBtn').setAttribute('onclick', 'toggleAuthModal()');
            
            // 관리자 탭 숨기기
            document.getElementById('tabAdminBtn').classList.add('hidden');
            switchTab('scan');
            alert('작업자 모드로 전환되었습니다.');
        }

        // 관리자 비밀번호 변경 기능
        function changeAdminPassword() {
            const currentPwInput = document.getElementById('currentPassword').value;
            const newPwInput = document.getElementById('newPassword').value;

            if (currentPwInput !== adminPw) {
                alert('기존 비밀번호가 일치하지 않습니다.');
                return;
            }

            if (!newPwInput || newPwInput.length < 4) {
                alert('새 비밀번호를 4자리 이상 입력해주세요.');
                return;
            }

            adminPw = newPwInput;
            localStorage.setItem('yjhitech_admin_pw', adminPw);
            alert('관리자 비밀번호가 성공적으로 변경되었습니다!');
            
            document.getElementById('currentPassword').value = '';
            document.getElementById('newPassword').value = '';
        }

        // 자재 등록 및 수정
        function saveMaterial() {
            const code = document.getElementById('adminCode').value.trim();
            const name = document.getElementById('adminName').value.trim();
            const spec = document.getElementById('adminSpec').value.trim();
            const stock = parseInt(document.getElementById('adminStock').value);

            if(!code || !name) {
                alert('자재 코드와 자재명은 필수 입력입니다.');
                return;
            }

            const existing = materials.find(m => m.code === code);
            if(existing) {
                existing.name = name;
                existing.spec = spec;
                existing.stock = stock;
                alert('자재 정보가 수정되었습니다.');
            } else {
                materials.push({ code, name, spec, stock });
                alert('새 자재가 등록되었습니다.');
            }

            localStorage.setItem('yjhitech_materials', JSON.stringify(materials));
            document.getElementById('adminCode').value = '';
            document.getElementById('adminName').value = '';
            document.getElementById('adminSpec').value = '';
            document.getElementById('adminStock').value = 0;
            switchTab('inventory');
        }

        // CSV 내보내기
        function exportCSV() {
            let csv = '\uFEFF자재코드,자재명,규격,재고수량\n';
            materials.forEach(m => {
                csv += `"${m.code}","${m.name}","${m.spec}",${m.stock}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "inventory_list.csv";
            link.click();
        }

        // 첫 실행 시 스캐너 구동
        window.onload = function() {
            startScanner();
        };
    </script>
</body>
</html>
